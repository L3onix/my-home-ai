services:
  # Serviço Ollama local (executa modelos em CPU)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"          # Exposto para testes externos e para o Open WebUI
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]   # Verifica se o servidor responde
      interval: 10s
      timeout: 5s
      retries: 5
    # (Sem GPU, mantenha o bloco abaixo comentado)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Serviço Qdrant - banco vetorial local
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__TELEMETRY_DISABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Serviço Open WebUI - interface web unificada
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      # Desativa autenticação (use apenas em redes confiáveis)
      - WEBUI_AUTH=false

      # --- BACKENDS DE LLM ---
      # URL do servidor Ollama local (padrão)
      - OLLAMA_BASE_URL=http://ollama:11434

      # Lista de servidores adicionais (remoto)
      # O Open WebUI permitirá escolher qualquer modelo de qualquer servidor
      - OLLAMA_BASE_URLS=http://ollama:11434,http://192.168.1.2:3000
      #                                 ↑ IP e PORTA do servidor remoto (ajuste se necessário)

      # --- VETOR DATABASE (mantido local) ---
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333

    volumes:
      - open-webui_data:/app/backend/data
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  ollama_data:
  qdrant_data:
  open-webui_data:
